name: Publicar instalador GPEDIT
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compilar instalador Windows x64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o Instalar_GPEDIT_v1.0.exe .
      - name: Validar e calcular SHA256
        run: |
          file Instalar_GPEDIT_v1.0.exe | grep -q 'PE32+'
          sha256sum Instalar_GPEDIT_v1.0.exe > SHA256SUMS.txt
      - name: Publicar Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 Instalar_GPEDIT_v1.0.exe SHA256SUMS.txt --clobber
          else
            gh release create v1.0.0 Instalar_GPEDIT_v1.0.exe SHA256SUMS.txt --title 'GPEDIT v1.0.0' --notes 'Utilitario DISM para os pacotes de politica de grupo presentes no Windows. IMPORTANTE: Windows Home nao inclui gpedit.msc como recurso oficialmente suportado e esta ferramenta nao garante o funcionamento das politicas nessa edicao.' --latest
          fi
